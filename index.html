<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPATDA - Sistem Informasi Manajemen Pajak Daerah Kabupaten Sidrap</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .login-bg { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%); min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .animate-fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100">
    <div id="loginPage" class="login-bg flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-8 animate-fade-in">
                <h1 class="text-3xl font-bold text-white mb-2">SIMPATDA</h1>
                <p class="text-blue-200 text-sm">Sistem Informasi Manajemen Pajak Daerah</p>
            </div>

            <div class="glass-card rounded-2xl p-8 animate-fade-in">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Masuk ke Sistem</h2>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                        <input type="text" id="username" required 
                            class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none"
                            placeholder="admin atau operator">
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" id="password" required 
                            class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none"
                            placeholder="Masukkan password">
                    </div>

                    <button type="submit" 
                        class="w-full py-3 bg-gradient-to-r from-blue-600 to-blue-800 text-white rounded-xl font-semibold hover:from-blue-700 hover:to-blue-900">
                        Masuk
                    </button>
                </form>

                <div id="loginError" class="hidden mt-4 p-4 bg-red-100 border border-red-300 text-red-700 rounded-lg text-sm">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="errorMessage">Username atau password salah</span>
                </div>
                
                <div class="mt-6 pt-4 border-t text-center text-xs text-gray-600">
                    <p><strong>Akun Aktif (Bisa Login):</strong></p>
                    <p>• admin / admin123</p>
                    <p>• operator / operator123</p>
                </div>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden w-full bg-white">
        <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow p-6">
            <div class="flex items-center justify-between max-w-6xl mx-auto">
                <div>
                    <h1 class="text-3xl font-bold">SIMPATDA</h1>
                    <p class="text-blue-100">Selamat datang, <span id="userDisplay">User</span>!</p>
                </div>
                <button onclick="handleLogout()" class="px-6 py-2 bg-red-600 hover:bg-red-700 rounded-lg">
                    <i class="fas fa-sign-out-alt mr-2"></i>Logout
                </button>
            </div>
        </header>
        <main class="max-w-6xl mx-auto p-6">
            <div class="bg-green-50 border-l-4 border-green-500 p-4 mb-6">
                <p class="text-green-800"><strong>✓ Login Berhasil!</strong> Verifikasi status akun aktif telah berhasil dilakukan.</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">Informasi User</h2>
                <div id="userInfo" class="text-gray-700 space-y-2">
                    <!-- User info will be displayed here -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // Default users dengan status
        const defaultUsers = [
            { id: 1, fullName: 'Administrator', username: 'admin', password: 'admin123', role: 'Admin', status: 'active' },
            { id: 2, fullName: 'Operator Pajak', username: 'operator', password: 'operator123', role: 'Operator', status: 'active' }
        ];

        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginError = document.getElementById('loginError');
            const errorMessage = document.getElementById('errorMessage');
            
            loginError.classList.add('hidden');
            
            // Load users
            let users = defaultUsers;
            try {
                const stored = localStorage.getItem('simpatdaUsers');
                if (stored) users = JSON.parse(stored);
            } catch (e) {}
            
            // Find user
            const user = users.find(u => u.username === username && u.password === password);
            
            if (!user) {
                errorMessage.textContent = 'Username atau password salah';
                loginError.classList.remove('hidden');
                return;
            }
            
            // ====== PENTING: CEK STATUS AKUN ======
            if (user.status !== 'active') {
                errorMessage.innerHTML = `<i class="fas fa-lock mr-2"></i><strong>Akun Tidak Aktif</strong><br><small>Hubungi administrator untuk mengaktifkan akun.</small>`;
                loginError.classList.remove('hidden');
                console.warn(`❌ Login ditolak: ${username} - Status: ${user.status}`);
                return;
            }
            
            // LOGIN BERHASIL
            console.log(`✓ Login berhasil: ${username}`);
            localStorage.setItem('currentUser', JSON.stringify(user));
            
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userDisplay').textContent = user.fullName;
            document.getElementById('userInfo').innerHTML = `
                <p><strong>Nama:</strong> ${user.fullName}</p>
                <p><strong>Username:</strong> ${user.username}</p>
                <p><strong>Role:</strong> ${user.role}</p>
                <p><strong>Status:</strong> <span class="text-green-600 font-bold">✓ Aktif</span></p>
            `;
        }

        function handleLogout() {
            if (confirm('Apakah Anda yakin ingin logout?')) {
                localStorage.removeItem('currentUser');
                location.reload();
            }
        }

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', function() {
            localStorage.setItem('simpatdaUsers', JSON.stringify(defaultUsers));
            
            const saved = localStorage.getItem('currentUser');
            if (saved) {
                try {
                    const user = JSON.parse(saved);
                    if (user.status === 'active') {
                        document.getElementById('loginPage').style.display = 'none';
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('userDisplay').textContent = user.fullName;
                        document.getElementById('userInfo').innerHTML = `
                            <p><strong>Nama:</strong> ${user.fullName}</p>
                            <p><strong>Username:</strong> ${user.username}</p>
                            <p><strong>Role:</strong> ${user.role}</p>
                            <p><strong>Status:</strong> <span class="text-green-600 font-bold">✓ Aktif</span></p>
                        `;
                    }
                } catch (e) {
                    localStorage.removeItem('currentUser');
                }
            }
        });
    </script>
</body>
</html>
